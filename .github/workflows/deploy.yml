name: Auto Deploy to OCI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'tests/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd ~/tenis4uMonitor
            git pull origin main
            
            # Generate .env from secrets (values are substituted by GitHub Actions)
            cat > .env <<'EOF'
            APP_ENV=prod
            DEV_DISCORD__GLOBAL_WEBHOOK_URL=${{ secrets.DEV_DISCORD__GLOBAL_WEBHOOK_URL }}
            PROD_DISCORD__GLOBAL_WEBHOOK_URL=${{ secrets.PROD_DISCORD__GLOBAL_WEBHOOK_URL }}
            DEV_DISCORD__FACILITY__FAME_SPORT_CLUB_WEBHOOK_URL=${{ secrets.DEV_DISCORD__FACILITY__FAME_SPORT_CLUB_WEBHOOK_URL }}
            PROD_DISCORD__FACILITY__FAME_SPORT_CLUB_WEBHOOK_URL=${{ secrets.PROD_DISCORD__FACILITY__FAME_SPORT_CLUB_WEBHOOK_URL }}
            DEV_DISCORD__FACILITY__BLONIA_SPORT_WEBHOOK_URL=${{ secrets.DEV_DISCORD__FACILITY__BLONIA_SPORT_WEBHOOK_URL }}
            PROD_DISCORD__FACILITY__BLONIA_SPORT_WEBHOOK_URL=${{ secrets.PROD_DISCORD__FACILITY__BLONIA_SPORT_WEBHOOK_URL }}
            EOF

            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart tenis4uscript.service
